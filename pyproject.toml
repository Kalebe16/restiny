#############
## Package ##
#############
[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "restiny"
dynamic = ["version"]
description = "A minimalist HTTP client, no bullshit"
authors = [{ name = "Kalebe Chimanski de Almeida", email = "kalebe.chi.almeida@gmail.com" }]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.28, <0.29",
    "sqlalchemy>=2.0, <2.1",
    "pydantic>=2.12, <2.13",
    "PyYAML>=6.0, <6.1",
    "qtmonaco>=0.10, <0.11",
    "qasync>=0.28, <0.29",
    "PySide6>=6.11, <6.12",
    "pyqtdarktheme-fork>=2.3, <2.4"
]
keywords = [
    "restiny",
    "http",
    "client",
    "http-client",
    "api-client",
    "desktop",
    "api",
    "testing",
    "developer-tool",
    "pyside",
    "qt",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",

    "Environment :: X11 Applications :: Qt",

    "Typing :: Typed",

    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",

    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",

    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Testing",
    "Topic :: Software Development :: Libraries :: Application Frameworks",

    "Natural Language :: English",
]

[project.urls]
Homepage = "https://github.com/Kalebe16/restiny"
Repository = "https://github.com/Kalebe16/restiny"
Issues = "https://github.com/Kalebe16/restiny/issues"
Documentation = "https://github.com/Kalebe16/restiny/blob/main/README.md"

[project.scripts]
restiny = "restiny.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "restiny.__about__.__version__" }

[tool.setuptools.packages.find]
include = ["restiny*"]

[tool.setuptools.package-data]
restiny = ["assets/**/*", "data/sql/**/*"]


##########
## Ruff ##
##########
[tool.ruff]
line-length = 79
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "B", "I", "UP"]
ignore = ["E501", "B006", "UP037"]

[tool.ruff.format]
quote-style = "single"
